<div class="auth-page">

  <div class="auth-container">

    <h1>Login</h1>

    <form (ngSubmit)="login()">

      <label for="email">Email</label>

      <input
        id="email"
        type="email"
        [(ngModel)]="email"
        name="email"
        required
      />

      <label for="password">Password</label>

      <input
        id="password"
        type="password"
        [(ngModel)]="password"
        name="password"
        required
      />

      <button type="submit">
        Login
      </button>

      <p class="error" *ngIf="errorMessage">
        {{ errorMessage }}
      </p>

    </form>

  </div>

</div>
